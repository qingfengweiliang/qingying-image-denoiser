name: Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install numpy==1.23.5 scipy==1.10.1 Pillow==11.0.0 opencv-python-headless==4.8.1.78
      - run: python android/tests/test_progress.py
      - run: python android/tests/test_processing.py
  native-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Tencent/ncnn
          ref: 20250503
          path: ncnn-source
          submodules: recursive
      - run: sudo apt-get update && sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers
      - name: Build pinned ncnn with Vulkan
        run: |
          cmake -S ncnn-source -B ncnn-build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/ncnn-install" -DNCNN_VULKAN=ON -DNCNN_BUILD_TOOLS=OFF -DNCNN_BUILD_EXAMPLES=OFF -DNCNN_BUILD_BENCHMARK=OFF
          cmake --build ncnn-build -j 2
          cmake --install ncnn-build
      - name: CPU and software Vulkan model/progress regression
        run: |
          cmake -S android/tests/native -B native-tests -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/ncnn-install"
          cmake --build native-tests -j 2
          ./native-tests/smoke
          ./native-tests/smoke --gpu
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
      - name: Fetch verified ncnn
        run: python android/scripts/prepare_ncnn.py
      - name: Build and lint
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Qingying-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-and-test-apk
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/apk/androidTest/debug/*.apk
